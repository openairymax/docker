# =============================================================================
# AgentOS Docker Compose - 开发环境 (Development)
# 版本：3.0.0 (Enterprise-Grade)
# 最后更新：2026-04-23
#
# 🎯 设计原则:
# ✅ 与生产环境保持一致的架构（便于迁移）
# ✅ 开发友好（热重载、调试工具、详细日志）
# ✅ 安全默认配置（非 root、最小权限、网络隔离）
# ✅ 可观测性内置（健康检查、结构化日志、监控就绪）
#
# 📋 使用方法:
#   # 启动核心服务
#   docker compose -f docker/docker-compose.yml up -d
#
#   # 启动完整栈（含监控）
#   docker compose -f docker/docker-compose.yml --profile monitoring up -d
#
#   # 启动所有 Daemon 服务
#   docker compose -f docker/docker-compose.yml --profile daemons up -d
#
#   # 启动 OpenLab
#   docker compose -f docker/docker-compose.yml --profile openlab up -d
#
#   # 查看日志
#   docker compose -f docker/docker-compose.yml logs -f kernel gateway
#
# 🔗 架构拓扑:
#   [OpenLab] ←→ [Gateway:18789] ←→ [Kernel:18080]
#                                      ↓
#               [LLM:8080] [Tool:8081] [Market:8082] [Sched:8083] [Monit:9090]
#                                      ↓
#                              [PostgreSQL:5432]
#                              [Redis:6379]
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL - 数据库服务
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: agentos-postgres-dev
    hostname: agentos-postgres
    restart: unless-stopped

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentos}
      POSTGRES_USER: ${POSTGRES_USER:-agentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_2024}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"

    command:
      - postgres
      - -c, max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c, shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c, effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-512MB}
      - -c, work_mem=${PG_WORK_MEM:-4MB}
      - -c, maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-32MB}
      - -c, wal_level=replica
      - -c, log_min_duration_statement=${PG_SLOW_QUERY_MS:-1000}
      - -c, log_statement=all

    networks:
      - agentos-backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentos} -d ${POSTGRES_DB:-agentos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        tag: "{{.Name}}"

  # ===========================================================================
  # Redis - 缓存和会话存储
  # ===========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: agentos-redis-dev
    hostname: agentos-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data:rw

    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-dev_redis_2024}
      --save ""
      --loglevel verbose

    networks:
      - agentos-backend

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.125'
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}"

  # ===========================================================================
  # 内核服务 (Kernel) - AgentOS 微内核核心
  # 基于: Dockerfile.kernel (target: runtime)
  # 源码位置: agentos/atoms/corekern/
  # 端口: 18080 (IPC API) + 9090 (Prometheus Metrics)
  # ===========================================================================
  kernel:
    build:
      context: ..
      dockerfile: docker/Dockerfile.kernel
      target: runtime
      args:
        BUILD_TYPE: Debug
        ENABLE_TESTS: ON
    image: spharx/agentos-kernel:dev-latest
    container_name: agentos-kernel-dev
    hostname: agentos-kernel
    restart: unless-stopped

    ports:
      - "${KERNEL_IPC_PORT:-18080}:18080"
      - "${KERNEL_METRICS_PORT:-9090}:9090"

    volumes:
      - ./config:/app/config:ro
      - heapstore-data:/var/lib/agentos/data:rw
      - heapstore-logs:/var/lib/agentos/logs:rw
      - heapstore-registry:/var/lib/agentos/registry:rw
      - heapstore-traces:/var/lib/agentos/traces:rw
      - heapstore-ipc:/var/lib/agentos/ipc:rw
      - heapstore-memory:/var/lib/agentos/memory:rw

    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - AGENTOS_CUPOLAS_ENABLED=true
      - AGENTOS_PERMISSION_MODE=strict
      - AGENTOS_SANITIZER_MODE=strict
      - AGENTOS_AUDIT_ENABLED=true
      - HEAPSTORE_ROOT_PATH=/var/lib/agentos/data
      - HEAPSTORE_MAX_LOG_SIZE_MB=100
      - HEAPSTORE_LOG_RETENTION_DAYS=7
      - HEAPSTORE_TRACE_RETENTION_DAYS=3
      - HEAPSTORE_AUTO_CLEANUP=true
      - HEAPSTORE_CIRCUIT_THRESHOLD=5
      - HEAPSTORE_CIRCUIT_TIMEOUT_SEC=30
      - AGENTOS_DB_URL=postgresql://${POSTGRES_USER:-agentos}:${POSTGRES_PASSWORD:-dev_password_2024}@postgres:5432/${POSTGRES_DB:-agentos}
      - AGENTOS_REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_2024}@redis:6379/0
      - TZ=${TZ:-Asia/Shanghai}
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8

    networks:
      - agentos-backend

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_PTRACE

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
        tag: "{{.Name}}"

  # ===========================================================================
  # Gateway - 网关服务
  # 基于: Dockerfile.daemon (target: gateway)
  # 源码位置: agentos/gateway/
  # 端口: 18789 (API) + 18790 (Admin)
  # ===========================================================================
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.daemon
      target: gateway
    image: spharx/agentos-gateway:dev-latest
    container_name: agentos-gateway-dev
    hostname: agentos-gateway
    restart: unless-stopped

    ports:
      - "${GATEWAY_PORT:-18789}:18789"
      - "${GATEWAY_ADMIN_PORT:-18790}:18790"

    volumes:
      - ./config/gateway.yaml:/app/config/gateway.yaml:ro

    environment:
      GATEWAY_BIND_ADDRESS: 0.0.0.0
      GATEWAY_PORT: 18789
      GATEWAY_ADMIN_PORT: 18790
      GATEWAY_UPSTREAM_URL: http://kernel:18080
      GATEWAY_PROTOCOLS: http,websocket,stdio
      GATEWAY_GLOBAL_QPS: ${GATEWAY_GLOBAL_QPS:-5000}
      GATEWAY_PER_IP_QPS: ${GATEWAY_PER_IP_QPS:-100}
      GATEWAY_JWT_SECRET: ${GATEWAY_JWT_SECRET:-dev_jwt_secret_2024_change_me}
      GATEWAY_JWT_ISSUER: agentos-gateway-dev
      TOKEN_EXPIRY_HOURS: ${TOKEN_EXPIRY_HOURS:-4}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-2}
      TZ: ${TZ:-Asia/Shanghai}
      LANG: C.UTF-8

    networks:
      - agentos-backend
      - agentos-frontend

    depends_on:
      kernel:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
        tag: "{{.Name}}"

  # ===========================================================================
  # LLM Daemon - LLM 服务
  # 源码位置: agentos/daemon/llm_d/
  # 端口: 8080
  # ===========================================================================
  llm:
    build:
      context: ..
      dockerfile: docker/Dockerfile.daemon
      target: llm
    image: spharx/agentos-llm:dev-latest
    container_name: agentos-llm-dev
    hostname: agentos-llm
    restart: unless-stopped
    profiles:
      - daemons

    ports:
      - "8080:8080"

    volumes:
      - ./config/daemon:/app/config:ro
      - llm-cache-data:/var/lib/agentos/llm/cache:rw

    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - LLM_TCP_PORT=8080
      - LLM_TCP_HOST=0.0.0.0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-gpt-4}
      - LLM_CACHE_ENABLED=true
      - LLM_CACHE_MAX_SIZE=1000
      - AGENTOS_DB_URL=postgresql://${POSTGRES_USER:-agentos}:${POSTGRES_PASSWORD:-dev_password_2024}@postgres:5432/${POSTGRES_DB:-agentos}
      - TZ=${TZ:-Asia/Shanghai}

    networks:
      - agentos-backend

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
        tag: "{{.Name}}"

  # ===========================================================================
  # Tool Daemon - 工具服务
  # 源码位置: agentos/daemon/tool_d/
  # 端口: 8081
  # ===========================================================================
  tool:
    build:
      context: ..
      dockerfile: docker/Dockerfile.daemon
      target: tool
    image: spharx/agentos-tool:dev-latest
    container_name: agentos-tool-dev
    hostname: agentos-tool
    restart: unless-stopped
    profiles:
      - daemons

    ports:
      - "8081:8081"

    volumes:
      - ./config/daemon:/app/config:ro
      - tool-cache-data:/var/lib/agentos/tool/cache:rw

    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - TOOL_TCP_PORT=8081
      - TOOL_TCP_HOST=0.0.0.0
      - AGENTOS_DB_URL=postgresql://${POSTGRES_USER:-agentos}:${POSTGRES_PASSWORD:-dev_password_2024}@postgres:5432/${POSTGRES_DB:-agentos}
      - AGENTOS_REDIS_URL=redis://:${REDIS_PASSWORD:-dev_redis_2024}@redis:6379/0
      - TZ=${TZ:-Asia/Shanghai}

    networks:
      - agentos-backend

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
        tag: "{{.Name}}"

  # ===========================================================================
  # Market Daemon - 市场服务
  # 源码位置: agentos/daemon/market_d/
  # 端口: 8082
  # ===========================================================================
  market:
    build:
      context: ..
      dockerfile: docker/Dockerfile.daemon
      target: market
    image: spharx/agentos-market:dev-latest
    container_name: agentos-market-dev
    hostname: agentos-market
    restart: unless-stopped
    profiles:
      - daemons

    ports:
      - "8082:8082"

    volumes:
      - ./config/daemon:/app/config:ro
      - market-data:/var/lib/agentos/market:rw

    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - MARKET_TCP_PORT=8082
      - MARKET_TCP_HOST=0.0.0.0
      - AGENTOS_DB_URL=postgresql://${POSTGRES_USER:-agentos}:${POSTGRES_PASSWORD:-dev_password_2024}@postgres:5432/${POSTGRES_DB:-agentos}
      - TZ=${TZ:-Asia/Shanghai}

    networks:
      - agentos-backend

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
        tag: "{{.Name}}"

  # ===========================================================================
  # Scheduler Daemon - 调度器服务
  # 源码位置: agentos/daemon/sched_d/
  # 端口: 8083
  # ===========================================================================
  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.daemon
      target: scheduler
    image: spharx/agentos-scheduler:dev-latest
    container_name: agentos-scheduler-dev
    hostname: agentos-scheduler
    restart: unless-stopped
    profiles:
      - daemons

    ports:
      - "8083:8083"

    volumes:
      - ./config/daemon:/app/config:ro
      - scheduler-data:/var/lib/agentos/scheduler:rw

    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - SCHED_TCP_PORT=8083
      - SCHED_TCP_HOST=0.0.0.0
      - AGENTOS_DB_URL=postgresql://${POSTGRES_USER:-agentos}:${POSTGRES_PASSWORD:-dev_password_2024}@postgres:5432/${POSTGRES_DB:-agentos}
      - TZ=${TZ:-Asia/Shanghai}

    networks:
      - agentos-backend

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
        tag: "{{.Name}}"

  # ===========================================================================
  # Monitor Daemon - 监控服务
  # 源码位置: agentos/daemon/monit_d/
  # 端口: 9090 (metrics)
  # ===========================================================================
  monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.daemon
      target: monitor
    image: spharx/agentos-monitor:dev-latest
    container_name: agentos-monitor-dev
    hostname: agentos-monitor
    restart: unless-stopped
    profiles:
      - daemons

    ports:
      - "9091:9090"

    volumes:
      - ./config/daemon:/app/config:ro
      - monitor-data:/var/lib/agentos/monitor:rw

    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - MONIT_TCP_PORT=9090
      - MONIT_TCP_HOST=0.0.0.0
      - MONIT_EXPORT_INTERVAL_MS=60000
      - AGENTOS_DB_URL=postgresql://${POSTGRES_USER:-agentos}:${POSTGRES_PASSWORD:-dev_password_2024}@postgres:5432/${POSTGRES_DB:-agentos}
      - TZ=${TZ:-Asia/Shanghai}

    networks:
      - agentos-backend

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
        tag: "{{.Name}}"

  # ===========================================================================
  # OpenLab - 应用服务 (可选)
  # 基于: Dockerfile.openlab
  # 源码位置: agentos/openlab/
  # 端口: 5173 (Dev) + 443 (Prod)
  # ===========================================================================
  openlab:
    build:
      context: ..
      dockerfile: docker/Dockerfile.openlab
      target: dev
    image: spharx/agentos-openlab:dev-latest
    container_name: agentos-openlab-dev
    hostname: agentos-openlab
    restart: unless-stopped
    profiles:
      - openlab

    ports:
      - "5173:5173"
      - "8000:8000"

    volumes:
      - ../agentos/openlab:/app:rw
      - /app/node_modules
      - ./config/openlab:/app/config:ro

    environment:
      - VITE_API_URL=http://gateway:18789
      - VITE_WS_URL=ws://gateway:18789
      - NODE_ENV=development
      - TZ=${TZ:-Asia/Shanghai}

    networks:
      - agentos-frontend

    depends_on:
      - gateway

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        tag: "{{.Name}}"

  # ===========================================================================
  # Prometheus - 指标收集 (监控栈)
  # 启动方式: docker compose --profile monitoring up -d
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: agentos-prometheus-dev
    hostname: agentos-prometheus
    restart: unless-stopped
    profiles:
      - monitoring

    ports:
      - "9092:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus:rw

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--tsdb.path=/prometheus'
      - '--tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'

    networks:
      - agentos-backend

    depends_on:
      kernel:
        condition: service_healthy
      monitor:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"
        tag: "{{.Name}}"

  # ===========================================================================
  # AlertManager - 告警路由 (监控栈)
  # ===========================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: agentos-alertmanager-dev
    hostname: agentos-alertmanager
    restart: unless-stopped
    profiles:
      - monitoring

    ports:
      - "9093:9093"

    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager:rw

    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=:9093'
      - '--log.level=info'

    networks:
      - agentos-backend

    depends_on:
      - prometheus

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.125'
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
        tag: "{{.Name}}"

  # ===========================================================================
  # Grafana - 可视化面板 (监控栈)
  # ===========================================================================
  grafana:
    image: grafana/grafana:10.3.0
    container_name: agentos-grafana-dev
    hostname: agentos-grafana
    restart: unless-stopped
    profiles:
      - monitoring

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev_2024}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-piechart-panel"

    volumes:
      - grafana-data:/var/lib/grafana:rw
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - agentos-frontend

    depends_on:
      - prometheus

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.0625'
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
        tag: "{{.Name}}"

networks:
  # ---------------------------------------------------------------------------
  # 后端网络 - 内核服务、数据库、缓存
  # 子网: 172.21.0.0/16
  # ---------------------------------------------------------------------------
  agentos-backend:
    driver: bridge
    name: agentos_backend
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

  # ---------------------------------------------------------------------------
  # 前端网络 - 网关、OpenLab
  # 子网: 172.22.0.0/16
  # ---------------------------------------------------------------------------
  agentos-frontend:
    driver: bridge
    name: agentos_frontend
    ipam:
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1

volumes:
  # ---------------------------------------------------------------------------
  # 核心数据 - PostgreSQL 和 Redis
  # ---------------------------------------------------------------------------
  postgres-data:
    name: agentos_postgres_data
    driver: local
  redis-data:
    name: agentos_redis_data
    driver: local

  # ---------------------------------------------------------------------------
  # HeapStore 数据 (内核服务)
  # ---------------------------------------------------------------------------
  heapstore-data:
    name: agentos_heapstore_data
    driver: local
  heapstore-logs:
    name: agentos_heapstore_logs
    driver: local
  heapstore-registry:
    name: agentos_heapstore_registry
    driver: local
  heapstore-traces:
    name: agentos_heapstore_traces
    driver: local
  heapstore-ipc:
    name: agentos_heapstore_ipc
    driver: local
  heapstore-memory:
    name: agentos_heapstore_memory
    driver: local

  # ---------------------------------------------------------------------------
  # Daemon 服务数据
  # ---------------------------------------------------------------------------
  llm-cache-data:
    name: agentos_llm_cache
    driver: local
  tool-cache-data:
    name: agentos_tool_cache
    driver: local
  market-data:
    name: agentos_market
    driver: local
  scheduler-data:
    name: agentos_scheduler
    driver: local
  monitor-data:
    name: agentos_monitor
    driver: local

  # ---------------------------------------------------------------------------
  # 监控数据
  # ---------------------------------------------------------------------------
  prometheus-data:
    name: agentos_prometheus_tsdb
    driver: local
  alertmanager-data:
    name: agentos_alertmanager_data
    driver: local
  grafana-data:
    name: agentos_grafana_data
    driver: local
