# =============================================================================
# AgentRT Docker Compose - 开发环境
# 版本: 0.1.1
# 最后更新: 2026-07-02
#
# 使用方法:
#   docker compose --env-file .env.dev up -d
#   docker compose --env-file .env.dev down
# =============================================================================

services:
  # ===========================================================================
  # 内核服务 (Kernel) — 所有 daemon 进程的基础容器
  # ===========================================================================
  kernel:
    build:
      context: ../..
      dockerfile: products/docker/Dockerfile.kernel
      target: runtime
      args:
        BUILD_TYPE: Debug
        ENABLE_TESTS: ON
    image: ${DOCKER_REGISTRY:-spharx}/agentrt-kernel:${AGENTRT_VERSION:-0.1.1}-dev
    container_name: agentrt-kernel-dev
    hostname: agentrt-kernel
    restart: unless-stopped
    ports:
      - "${KERNEL_IPC_PORT:-18080}:18080"
    volumes:
      - agentrt_data:/var/lib/agentrt
      - agentrt_logs:/var/log/agentrt
    environment:
      - AGENTRT_ENV=development
      - AGENTRT_KERNEL_PORT=18080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - agentrt-net

  # ===========================================================================
  # 市场调度 Daemon (market_d)
  # ===========================================================================
  market_d:
    build:
      context: ../..
      dockerfile: products/docker/Dockerfile.daemon
      target: runtime
      args:
        BUILD_TYPE: Debug
    image: ${DOCKER_REGISTRY:-spharx}/agentrt-market_d:${AGENTRT_VERSION:-0.1.1}-dev
    container_name: agentrt-market_d-dev
    hostname: agentrt-market
    restart: unless-stopped
    depends_on:
      kernel:
        condition: service_healthy
    volumes:
      - agentrt_data:/var/lib/agentrt
    environment:
      - AGENTRT_ENV=development
      - AGENTRT_KERNEL_HOST=kernel
      - AGENTRT_KERNEL_PORT=18080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - agentrt-net

  # ===========================================================================
  # 监控 Daemon (monit_d)
  # ===========================================================================
  monit_d:
    build:
      context: ../..
      dockerfile: products/docker/Dockerfile.daemon
      target: runtime
      args:
        BUILD_TYPE: Debug
    image: ${DOCKER_REGISTRY:-spharx}/agentrt-monit_d:${AGENTRT_VERSION:-0.1.1}-dev
    container_name: agentrt-monit_d-dev
    hostname: agentrt-monit
    restart: unless-stopped
    depends_on:
      kernel:
        condition: service_healthy
    volumes:
      - agentrt_logs:/var/log/agentrt
    environment:
      - AGENTRT_ENV=development
      - AGENTRT_KERNEL_HOST=kernel
      - AGENTRT_KERNEL_PORT=18080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - agentrt-net

  # ===========================================================================
  # 通知 Daemon (notify_d)
  # ===========================================================================
  notify_d:
    build:
      context: ../..
      dockerfile: products/docker/Dockerfile.daemon
      target: runtime
      args:
        BUILD_TYPE: Debug
    image: ${DOCKER_REGISTRY:-spharx}/agentrt-notify_d:${AGENTRT_VERSION:-0.1.1}-dev
    container_name: agentrt-notify_d-dev
    hostname: agentrt-notify
    restart: unless-stopped
    depends_on:
      kernel:
        condition: service_healthy
    environment:
      - AGENTRT_ENV=development
      - AGENTRT_KERNEL_HOST=kernel
      - AGENTRT_KERNEL_PORT=18080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - agentrt-net

  # ===========================================================================
  # 观测 Daemon (observe_d)
  # ===========================================================================
  observe_d:
    build:
      context: ../..
      dockerfile: products/docker/Dockerfile.daemon
      target: runtime
      args:
        BUILD_TYPE: Debug
    image: ${DOCKER_REGISTRY:-spharx}/agentrt-observe_d:${AGENTRT_VERSION:-0.1.1}-dev
    container_name: agentrt-observe_d-dev
    hostname: agentrt-observe
    restart: unless-stopped
    depends_on:
      kernel:
        condition: service_healthy
    volumes:
      - agentrt_logs:/var/log/agentrt
    environment:
      - AGENTRT_ENV=development
      - AGENTRT_KERNEL_HOST=kernel
      - AGENTRT_KERNEL_PORT=18080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - agentrt-net

  # ===========================================================================
  # 调度 Daemon (sched_d)
  # ===========================================================================
  sched_d:
    build:
      context: ../..
      dockerfile: products/docker/Dockerfile.daemon
      target: runtime
      args:
        BUILD_TYPE: Debug
    image: ${DOCKER_REGISTRY:-spharx}/agentrt-sched_d:${AGENTRT_VERSION:-0.1.1}-dev
    container_name: agentrt-sched_d-dev
    hostname: agentrt-sched
    restart: unless-stopped
    depends_on:
      kernel:
        condition: service_healthy
    environment:
      - AGENTRT_ENV=development
      - AGENTRT_KERNEL_HOST=kernel
      - AGENTRT_KERNEL_PORT=18080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - agentrt-net

  # ===========================================================================
  # 工具 Daemon (tool_d)
  # ===========================================================================
  tool_d:
    build:
      context: ../..
      dockerfile: products/docker/Dockerfile.daemon
      target: runtime
      args:
        BUILD_TYPE: Debug
    image: ${DOCKER_REGISTRY:-spharx}/agentrt-tool_d:${AGENTRT_VERSION:-0.1.1}-dev
    container_name: agentrt-tool_d-dev
    hostname: agentrt-tool
    restart: unless-stopped
    depends_on:
      kernel:
        condition: service_healthy
    environment:
      - AGENTRT_ENV=development
      - AGENTRT_KERNEL_HOST=kernel
      - AGENTRT_KERNEL_PORT=18080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - agentrt-net

  # ===========================================================================
  # 网关服务 (Gateway)
  # ===========================================================================
  gateway:
    build:
      context: ../..
      dockerfile: products/docker/Dockerfile.daemon
      target: gateway
      args:
        BUILD_TYPE: Debug
    image: ${DOCKER_REGISTRY:-spharx}/agentrt-gateway:${AGENTRT_VERSION:-0.1.1}-dev
    container_name: agentrt-gateway-dev
    hostname: agentrt-gateway
    restart: unless-stopped
    depends_on:
      kernel:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "${GATEWAY_WS_PORT:-8081}:8081"
    environment:
      - AGENTRT_ENV=development
      - AGENTRT_KERNEL_HOST=kernel
      - AGENTRT_KERNEL_PORT=18080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - agentrt-net

# =============================================================================
# 网络
# =============================================================================
networks:
  agentrt-net:
    name: agentrt-net-dev
    driver: bridge

# =============================================================================
# 卷
# =============================================================================
volumes:
  agentrt_data:
    name: agentrt_data_dev
  agentrt_logs:
    name: agentrt_logs_dev