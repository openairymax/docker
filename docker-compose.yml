    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "${GATEWAY_WS_PORT:-8081}:8081"
    environment:
      - AGENTRT_ENV=development
      - AGENTRT_KERNEL_HOST=kernel
      - AGENTRT_KERNEL_PORT=18080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST http://localhost:8080/api/ -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"info.system\",\"params\":{}}' > /dev/null 2>&1 || pgrep -x supervisord > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - agentrt-net

# =============================================================================
# 网络
# =============================================================================
networks:
  agentrt-net:
    name: agentrt-net-dev
    driver: bridge

# =============================================================================
# 卷
# =============================================================================
volumes:
  agentrt_data:
    name: agentrt_data_dev
  agentrt_logs:
    name: agentrt_logs_dev
