# =============================================================================
# AgentRT Docker Compose - 开发环境
# 版本: 0.1.1
# 最后更新: 2026-08-10
#
# 使用方法:
#   docker compose --env-file .env.dev up -d
#   docker compose --env-file .env.dev down
#
# 服务说明:
#   - kernel: 基础容器（所有 daemon 进程的构建/运行基座）
#   - 其余 17 个服务与 agentrt/daemons 下的 daemon 一一对应（a2a_d/agent_d/
#     channel_d/cupolas_d/gateway_d/hook_d/info_d/llm_d/market_d/mem_d/monit_d/
#     notify_d/observe_d/plugin_d/sched_d/think_d/tool_d）
#   - 每个 daemon 容器内由 supervisord 统一拉起 17 个 daemon 进程；
#     健康检查统一探测 gateway 8080 的 JSON-RPC 端点（兜底检测 supervisord 存活）
# =============================================================================

services:
  # ===========================================================================
  # 内核服务 (Kernel) — 所有 daemon 进程的基础容器
  # ===========================================================================
  kernel:
    build:
      context: ../..
      dockerfile: products/docker/Dockerfile.kernel
      target: runtime
      args:
        BUILD_TYPE: Debug
        ENABLE_TESTS: ON
    image: ${DOCKER_REGISTRY:-spharx}/agentrt-kernel:${AGENTRT_VERSION:-0.1.1}-dev
    container_name: agentrt-kernel-dev
    hostname: agentrt-kernel
    restart: unless-stopped
    ports:
      - "${KERNEL_IPC_PORT:-18080}:18080"
    volumes:
      - agentrt_data:/var/lib/agentrt
      - agentrt_logs:/var/log/agentrt
    environment:
      - AGENTRT_ENV=development
      - AGENTRT_KERNEL_PORT=18080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - agentrt-net

  # ===========================================================================
  # A2A Daemon (a2a_d) — 智能体间通信（A2A 协议）
  # ===========================================================================
  a2a_d:
    build:
      context: ../..
      dockerfile: products/docker/Dockerfile.daemon
      target: runtime
      args:
        BUILD_TYPE: Debug
    image: ${DOCKER_REGISTRY:-spharx}/agentrt-a2a_d:${AGENTRT_VERSION:-0.1.1}-dev
    container_name: agentrt-a2a_d-dev
    hostname: agentrt-a2a
    restart: unless-stopped
    depends_on:
      kernel:
        condition: service_healthy
    volumes:
      - agentrt_data:/var/lib/agentrt
    environment:
      - AGENTRT_ENV=development
      - AGENTRT_KERNEL_HOST=kernel
      - AGENTRT_KERNEL_PORT=18080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -X POST http://localhost:8080/api/ -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"info.system\",\"params\":{}}' > /dev/null 2>&1 || pgrep -x supervisord > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - agentrt-net

  # ===========================================================================
  # Agent Daemon (agent_d) — Agent 生命周期管理（spawn/invoke/terminate）
