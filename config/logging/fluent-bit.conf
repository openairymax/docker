# =============================================================================
# AgentRT 日志聚合配置 (Fluent Bit)
# 版本: 0.1.1
# 用途: 收集所有容器日志并转发到 ELK Stack / Loki / CloudWatch
# =============================================================================

[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# =============================================================================
# 输入源 - Docker 日志驱动
# =============================================================================
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Tag               docker.*
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    DB                /var/log/fluent-bit-docker.db
    DB.Sync          Normal

# =============================================================================
# 过滤器 - 添加元数据
# =============================================================================
[FILTER]
    Name                kubernetes
    Match               docker.*
    Kube_URL            https://${KUBERNETES_SERVICE_HOST}:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Merge_Log           On
    Merge_Log_Key       log_processed
    K8S-Logging.Parser  On
    K8S-Logging.Exclude On

[FILTER]
    Name                modify
    Match               docker.*
    Add                environment staging
    Add                service agentrt
    Add                cluster_name ${CLUSTER_NAME:-agentrt-staging}

# =============================================================================
# 输出目标 - Loki (Grafana 默认日志后端)
# =============================================================================
[OUTPUT]
    Name                loki
    Match               *
    Host                loki.loki.svc.cluster.local
    Port                3100
    Labels             job=fluent-bit, environment=${ENVIRONMENT:-staging}
    Auto_Kubernetes     On
    Tenant_ID          agentrt
    Line_Format         json

# =============================================================================
# 输出目标 - Elasticsearch (备选)
# =============================================================================
[OUTPUT]
    Name                es
    Match               docker.*
    Host                elasticsearch.logging.svc.cluster.local
    Port                9200
    Index              agentrt-${ENVIRONMENT:-staging}-%Y.%m.%d
    Type               _doc
    Retry_Limit        False

# =============================================================================
# 输出目标 - CloudWatch (AWS)
# =============================================================================
[OUTPUT]
    Name                cloudwatch_logs
    Match               docker.*
    Region              ${AWS_REGION:-ap-east-1}
    Log_Group_Name      /ecs/agentrt/${ENVIRONMENT:-staging}
    Log_Stream_Prefix   container-
    Auto_Create_Group   True
