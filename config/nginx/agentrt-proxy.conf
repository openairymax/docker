server {
    listen 80;
    server_name _;

    # 重定向 HTTP 到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.agentrt.cn;

    # SSL 证书配置 (Let's Encrypt 或自签名)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 访问日志
    access_log /var/log/nginx/agentrt_access.log combined;
    error_log /var/log/nginx/agentrt_error.log warn;

    # 客户端请求体大小限制
    client_max_body_size 50m;

    # 代理缓冲区设置
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # 超时设置
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # ==========================================================================
    # Gateway API 反向代理 (主入口)
    # ==========================================================================
    location /api/ {
        proxy_pass http://gateway:18789;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # CORS 头 (白名单机制，BAN-57合规)
        set $cors_origin "";
        if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1|.*\.agentrt\.cn)$") {
            set $cors_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # WebSocket 端点
    location /ws {
        proxy_pass http://gateway:18789;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ==========================================================================
    # 健康检查端点 (无需认证)
    # ==========================================================================
    # Desktop客户端兼容: /health → Gateway /api/v1/health
    location = /health {
        access_log off;
        proxy_pass http://gateway:18789/api/v1/health;
    }

    # Kubernetes/Docker原生健康检查: /api/v1/health
    location = /api/v1/health {
        access_log off;
        proxy_pass http://gateway:18789/api/v1/health;
    }

    location = /ready {
        access_log off;
        proxy_pass http://gateway:18789/api/v1/health;
    }

    # ==========================================================================
    # 指标端点
    # ==========================================================================
    # Gateway业务指标 (Desktop客户端使用)
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://gateway:18789/api/v1/metrics;
    }

    # Prometheus监控指标 (内部采集)
    location = /prometheus/metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://prometheus:9090/metrics;
    }

    # ==========================================================================
    # Grafana UI (需要认证)
    # ==========================================================================
    location /grafana/ {
        auth_basic "AgentRT Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '"/' '/grafana/';
    }

    # ==========================================================================
    # OpenLab Web UI
    # ==========================================================================
    location /openlab/ {
        proxy_pass http://openlab:443/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================================
    # Desktop Web前端
    # ==========================================================================
    location /desktop/ {
        proxy_pass http://desktop:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================================
    # 静态资源缓存
    # ==========================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        proxy_pass http://gateway:18789;
    }

    # ==========================================================================
    # 默认拒绝其他请求
    # ==========================================================================
    location / {
        default_type application/json;
        return 404 '{"error": "Not Found", "code": 404}';
    }
}
