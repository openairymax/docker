; =============================================================================
; AgentRT Daemon Supervisor 配置
; 版本: 0.1.1
; 用途: 管理所有守护进程的生命周期
;
; 守护进程列表（与 agentrt/daemons 下 17 个 daemon 一一对应）:
;   - a2a_d: A2A 智能体通信服务守护进程
;   - agent_d: Agent 生命周期管理守护进程
;   - channel_d: 通道（Channel）服务守护进程
;   - cupolas_d: 安全穹顶（权限/净化/审计）服务守护进程
;   - gateway_d: API 网关守护进程（HTTP/WS/stdio 三协议，默认 8080/8081）
;   - hook_d: Hook 钩子注册与触发守护进程
;   - info_d: 系统信息采集守护进程（无参数，Unix socket）
;   - llm_d: LLM 服务管理守护进程
;   - market_d: 工具市场服务守护进程
;   - mem_d: 记忆存储服务守护进程
;   - monit_d: 系统监控守护进程
;   - notify_d: 通知推送守护进程（无参数，Unix socket）
;   - observe_d: 观测指标守护进程（无参数，Unix socket + Prometheus :9090/metrics）
;   - plugin_d: 插件加载/执行守护进程
;   - sched_d: 任务调度守护进程
;   - think_d: 双思考（GCCP+GRAD）守护进程
;   - tool_d: 工具执行守护进程
;
; 启动参数约定（已按各 daemon src/main.c 源码核实）:
;   - 统一 daemon_parse_args 的 daemon 使用 --manager <path>（a2a_d/agent_d/
;     cupolas_d/hook_d/llm_d/market_d/mem_d/monit_d/plugin_d/sched_d/think_d/tool_d）
;   - gateway_d 使用 -c <path>（自定义 parse_args，非 --manager）
;   - channel_d 兼容 --manager/-c（配置路径被接受并跳过）
;   - info_d/notify_d/observe_d 无命令行参数（main 忽略 argc/argv）
; =============================================================================

[supervisord]
; 使用前台模式运行（Docker容器需要）
nodaemon=true

; 日志配置
logfile=/app/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info

; PID文件
pidfile=/app/run/supervisord.pid

; 子进程目录
directory=/app

; 用户和组
user=agentrt

; UNIX socket权限（用于supervisorctl）
chmod=0770
chown=agentrt:agentrt

; HTTP服务器（可选，用于Web界面）
;[inet_http_server]
;port=*:9001
;username=admin
;password=your_password_here

; =============================================================================
; 各守护进程配置
; =============================================================================

[program:llm_d]
command=/app/bin/llm_d --manager /app/config/llm.json
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=10
user=agentrt
redirect_stderr=true
stdout_logfile=/app/logs/llm_d.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=AGENTRT_HOME="/app",AIRY_HOME="/app",LOG_LEVEL="%(ENV_LOG_LEVEL)s"

