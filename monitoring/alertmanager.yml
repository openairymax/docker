# =============================================================================
# AgentOS AlertManager 配置
# 版本: 3.0.0
# 用途: 定义告警路由、接收器、静默规则和抑制规则
# =============================================================================

# -----------------------------------------------------------------------------
# 全局配置
# -----------------------------------------------------------------------------
global:
  # SMTP 配置 (用于邮件告警)
  smtp_smarthost: '${SMTP_HOST:-localhost:25}'
  smtp_from: '${SMTP_FROM:-alertmanager@agentos.cn}'
  smtp_auth_username: '${SMTP_USER:-}'
  smtp_auth_password: '${SMTP_PASS:-}'

  # Slack API URL
  slack_api_url: '${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX}'

  # PagerDuty 服务密钥
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# -----------------------------------------------------------------------------
# 模板文件
# -----------------------------------------------------------------------------
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# -----------------------------------------------------------------------------
# 路由树
# -----------------------------------------------------------------------------
route:
  # 默认接收器
  receiver: 'default-receiver'

  # 分组规则 (将相同标签的告警合并)
  group_by: ['alertname', 'cluster', 'service']

  # 等待时间 (新告警等待多久才开始发送)
  group_wait: 30s

  # 等待时间 (已分组告警等待多久再次发送)
  group_interval: 5m

  # 重复间隔 (相同告警多久重发一次)
  repeat_interval: 4h

  # 子路由
  routes:
    # 1. 关键告警 (立即通知)
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      group_wait: 10s
      repeat_interval: 1h
      continue: false

    # 2. 警告告警 (通知 Slack + Email)
    - match:
        severity: warning
      receiver: 'slack-warnings'
      group_wait: 30s
      repeat_interval: 2h
      continue: true

      # 2.1 数据库相关警告
      - match:
          service: database
        receiver: 'dba-team-email'
        repeat_interval: 1h

    # 3. 信息通知 (仅 Slack)
    - match:
        severity: info
      receiver: 'slack-info'
      repeat_interval: 12h

    # 4. 内核服务告警
    - match:
        service: kernel
      receiver: 'kernel-team-slack'
      continue: true

# -----------------------------------------------------------------------------
# 接收器定义
# -----------------------------------------------------------------------------
receivers:
  # 默认接收器 (Email)
  - name: 'default-receiver'
    email_configs:
      - to: 'ops-team@agentos.cn'
        send_resolved: true
        html: '{{ template "email.default.html" . }}'

  # PagerDuty (关键告警)
  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY:-}'
        description: '{{ template "pagerduty.default.description" . }}'
        details:
          summary: '{{ template "pagerduty.default.summary" . }}'
          severity: critical
          source: '{{ .ExternalURL }}'

  # Slack 警告通道
  - name: 'slack-warnings'
    slack_configs:
      - channel: '#agentos-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: '{{ template "slack.default.text" . }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # Slack 信息通道
  - name: 'slack-info'
    slack_configs:
      - channel: '#agentos-info'
        send_resolved: true
        title: '[INFO] {{ .CommonAnnotations.summary }}'
        text: '{{ template "slack.default.text" . }}'

  # DBA 团队邮件
  - name: 'dba-team-email'
    email_configs:
      - to: 'dba-team@agentos.cn'
        send_resolved: true
        html: '{{ template "email.dba.html" . }}'

  # 内核团队 Slack
  - name: 'kernel-team-slack'
    slack_configs:
      - channel: '#agentos-kernel'
        send_resolved: true
        title: '[Kernel] {{ .CommonAnnotations.summary }}'
        text: '{{ template "slack.default.text" . }}'

# -----------------------------------------------------------------------------
# 抑制规则 (避免告警风暴)
# -----------------------------------------------------------------------------
inhibit_rules:
  # 如果服务完全宕机，抑制相关的性能告警
  - source_match:
      severity: critical
      alertname: 'ServiceDown'
    target_match:
      severity: warning
    equal: ['alertname', 'cluster', 'service']

  # 如果节点宕机，抑制该节点上所有告警
  - source_match:
      severity: critical
      alertname: 'NodeDown'
    target_match:
      severity: warning
    equal: ['cluster']

  # 如果数据库宕机，抑制慢查询告警
  - source_match:
      severity: critical
      alertname: 'PostgreSQLDown'
    target_match:
      alertname: 'SlowQueryDetected'
    equal: ['service']

# -----------------------------------------------------------------------------
# 静默规则 (维护窗口)
# -----------------------------------------------------------------------------
# 可通过 AlertManager UI 或 API 动态添加静默规则
# 示例: 每周日 02:00-04:00 静维护窗口
# POST /api/v2/silences
# {
#   "matchers": [{"name": "alertname", "value": ".*"}],
#   "startsAt": "2026-01-01T02:00:00Z",
#   "endsAt": "2026-01-01T04:00:00Z",
#   "createdBy": "admin",
#   "comment": "Planned maintenance window"
# }
