global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_HOST:-localhost:587}"
  smtp_from: "${SMTP_FROM:-alertmanager@agentrt.cn}"
  smtp_auth_username: "${SMTP_USERNAME}"
  smtp_auth_password: "${SMTP_PASSWORD}"
  smtp_require_tls: true

route:
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: "warning"

receivers:
  - name: "default"
    webhook_configs:
      - url: "${WEBHOOK_URL:-http://gateway:18789/api/v1/alerts}"

  - name: "critical"
    webhook_configs:
      - url: "${WEBHOOK_URL:-http://gateway:18789/api/v1/alerts/critical}"

  - name: "warning"
    webhook_configs:
      - url: "${WEBHOOK_URL:-http://gateway:18789/api/v1/alerts/warning}"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "service"]
