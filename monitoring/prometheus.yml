global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "agentrt"
    environment: "${ENVIRONMENT:-development}"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "kernel"
    metrics_path: "/api/v1/metrics"
    static_configs:
      - targets: ["kernel:9090"]
        labels:
          service: "kernel"

  - job_name: "gateway"
    metrics_path: "/api/v1/metrics"
    static_configs:
      - targets: ["gateway:18790"]
        labels:
          service: "gateway"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
