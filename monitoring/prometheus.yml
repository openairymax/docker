# =============================================================================
# AgentOS Prometheus 监控配置 (Prometheus Monitoring Configuration)
# 版本: 3.0.0 (Enterprise-Grade)
# 最后更新: 2026-04-23
#
# 📊 监控架构:
#   [Prometheus] → pull metrics from:
#     - Kernel (port 9090) - 内核指标
#     - Gateway (port 18789/metrics) - 网关指标
#     - LLM Daemon (port 8080/metrics) - LLM 指标
#     - Tool Daemon (port 8081/metrics) - 工具指标
#     - Market Daemon (port 8082/metrics) - 市场指标
#     - Scheduler Daemon (port 8083/metrics) - 调度指标
#     - Monitor Daemon (port 9090/metrics) - 监控指标
#     - PostgreSQL Exporter (9187) - 数据库指标
#     - Redis Exporter (9121) - 缓存指标
#
# 🔗 关联文件:
#   - docker-compose.yml / docker-compose.prod.yml (Prometheus 服务定义)
#   - monitoring/rules/agentos_alerts.yml (告警规则)
#   - monitoring/alertmanager.yml (告警路由)
#   - monitoring/grafana/provisioning/ (Grafana 数据源配置)
# =============================================================================

global:
  # 全局抓取间隔
  scrape_interval: 15s
  # 规则评估间隔
  evaluation_interval: 15s
  # 超时时间
  scrape_timeout: 10s
  # 外部标签
  external_labels:
    monitor: 'agentos-monitor'
    environment: '${ENVIRONMENT:-production}'
    cluster: 'agentos-prod'

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'
      timeout: 10s

# 告警规则文件
rule_files:
  - 'rules/*.yml'

# 抓取配置
scrape_configs:
  
  # ===========================================================================
  # 1. AgentOS 内核服务 (Kernel Service)
  # ===========================================================================
  - job_name: 'agentos-kernel'
    static_configs:
      - targets: ['kernel:9090']
        labels:
          service: 'kernel'
          component: 'microkernel'
          tier: 'core'
          env: 'production'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    sample_limit: 10000

  # ===========================================================================
  # 2. Gateway 网关服务
  # ===========================================================================
  - job_name: 'agentos-gateway'
    static_configs:
      - targets: ['gateway:18789']
        labels:
          service: 'gateway'
          component: 'api-gateway'
          tier: 'edge'
          env: 'production'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'

  # ===========================================================================
  # 3. LLM Daemon 服务
  # ===========================================================================
  - job_name: 'agentos-llm'
    static_configs:
      - targets: ['llm:8080']
        labels:
          service: 'llm'
          component: 'llm-daemon'
          tier: 'daemon'
          env: 'production'
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: '/metrics'

  # ===========================================================================
  # 4. Tool Daemon 服务
  # ===========================================================================
  - job_name: 'agentos-tool'
    static_configs:
      - targets: ['tool:8081']
        labels:
          service: 'tool'
          component: 'tool-daemon'
          tier: 'daemon'
          env: 'production'
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: '/metrics'

  # ===========================================================================
  # 5. Market Daemon 服务
  # ===========================================================================
  - job_name: 'agentos-market'
    static_configs:
      - targets: ['market:8082']
        labels:
          service: 'market'
          component: 'market-daemon'
          tier: 'daemon'
          env: 'production'
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: '/metrics'

  # ===========================================================================
  # 6. Scheduler Daemon 服务
  # ===========================================================================
  - job_name: 'agentos-scheduler'
    static_configs:
      - targets: ['scheduler:8083']
        labels:
          service: 'scheduler'
          component: 'scheduler-daemon'
          tier: 'daemon'
          env: 'production'
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: '/metrics'

  # ===========================================================================
  # 7. Monitor Daemon 服务
  # ===========================================================================
  - job_name: 'agentos-monitor'
    static_configs:
      - targets: ['monitor:9090']
        labels:
          service: 'monitor'
          component: 'monitor-daemon'
          tier: 'daemon'
          env: 'production'
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: '/metrics'

  # ===========================================================================
  # 8. PostgreSQL 数据库
  # ===========================================================================
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'database'
          component: 'postgresql'
          tier: 'data'
          env: 'production'
    scrape_interval: 30s
    scrape_timeout: 10s

  # ===========================================================================
  # 9. Redis 缓存
  # ===========================================================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'cache'
          component: 'redis'
          tier: 'data'
          env: 'production'
    scrape_interval: 15s
    scrape_timeout: 5s

  # ===========================================================================
  # 10. OpenLab 应用服务
  # ===========================================================================
  - job_name: 'openlab'
    static_configs:
      - targets: ['openlab:8000']
        labels:
          service: 'openlab'
          component: 'application'
          tier: 'frontend'
          env: 'production'
    scrape_interval: 15s
    scrape_timeout: 5s

  # ===========================================================================
  # 11. Prometheus 自监控
  # ===========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'monitoring'
          component: 'prometheus'
          tier: 'observability'
          env: 'production'
