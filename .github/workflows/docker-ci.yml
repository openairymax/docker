name: AgentOS Docker CI/CD

on:
  push:
    branches: [main, develop]
    paths: ['docker/**', 'agentos/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'  # 每天凌晨 4 点运行安全扫描

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ==========================================================================
  # 构建验证 (Build Verification)
  # ==========================================================================
  build:
    name: Build & Verify (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          if [ "${{ matrix.environment }}" = "dev" ]; then
            docker compose -f docker/docker-compose.yml build --parallel
          else
            docker compose -f docker/docker-compose.staging.yml build --parallel
          fi

      - name: Verify Dockerfiles linting
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.kernel
          failure-threshold: warning

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.daemon
          failure-threshold: warning

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.openlab
          failure-threshold: warning

      - name: Check Compose files validity
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose -f docker/docker-compose.prod.yml config --quiet
          docker compose -f docker/docker-compose.staging.yml config --quiet

  # ==========================================================================
  # 安全扫描 (Security Scanning)
  # ==========================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Build image for scanning
        run: docker build -t agentos-kernel:test -f docker/Dockerfile.kernel .

      - name: Scan kernel image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'agentos-kernel:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ==========================================================================
  # 集成测试 (Integration Tests)
  # ==========================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_agentos
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest requests httpx
          pip install -r tests/requirements.txt 2>/dev/null || true

      - name: Start services
        run: |
          docker compose -f docker/docker-compose.yml up -d kernel gateway
          sleep 30

      - name: Run health check
        run: |
          chmod +x docker/scripts/healthcheck.sh
          ./docker/scripts/healthcheck.sh --json || true

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short || true

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml logs --tail=200 > ci-logs.txt
          cat ci-logs.txt

      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  # ==========================================================================
  # 性能基准测试 (Performance Benchmark)
  # ==========================================================================
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: |
          docker compose -f docker/docker-compose.staging.yml up -d
          sleep 60

      - name: Run load tests
        run: |
          echo "Running performance benchmarks..."
          docker exec agentos-gateway-staging curl -sf http://localhost:18789/api/v1/health
          docker stats --no-stream --format "{{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}"

      - name: Collect metrics
        run: |
          echo "=== Resource Usage ===" >> benchmark-report.txt
          docker stats --no-stream >> benchmark-report.txt
          echo "" >> benchmark-report.txt
          echo "=== Health Status ===" >> benchmark-report.txt
          chmod +x docker/scripts/healthcheck.sh
          ./docker/scripts/healthcheck.sh --json >> benchmark-report.txt || true

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.txt

      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.staging.yml down -v

  # ==========================================================================
  # 镜像发布 (Image Publishing)
  # ==========================================================================
  publish:
    name: Publish Images
    runs-on: ubuntu-latest
    needs: [build, security-scan, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/agentos
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            latest

      - name: Build and push Kernel image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.kernel
          push: true
          tags: ghcr.io/${{ github.repository }}/agentos-kernel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.daemon
          target: gateway
          push: true
          tags: ghcr.io/${{ github.repository }}/agentos-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # 部署通知 (Deployment Notification)
  # ==========================================================================
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [publish]
    if: always()

    steps:
      - name: Send Slack notification
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ AgentOS Docker 镜像构建成功!\nCommit: ${{ github.sha }}\nBranch: ${{ github.ref_name }}"}' \
            "$SLACK_WEBHOOK_URL" || true

      - name: Send failure notification
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ AgentOS Docker 构建失败!\nCommit: ${{ github.sha }}\nBranch: ${{ github.ref_name }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|查看日志>"}' \
            "$SLACK_WEBHOOK_URL" || true
