name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: License check
        run: |
          if [ -f "LICENSE" ]; then
            echo "[OK] LICENSE present"
          else
            echo "[NO] LICENSE missing" && exit 1
          fi

      - name: Dockerfile presence validation
        run: |
          # 本模块不强行跑容器测试；CI 至少校验所有 Dockerfile.* 与 compose 定义存在。
          if ls Dockerfile* >/dev/null 2>&1; then
            echo "[OK] Dockerfiles found:"
            ls -1 Dockerfile*
          else
            echo "[NO] No Dockerfile found" && exit 1
          fi
          if [ -f "docker-compose.yml" ]; then
            echo "[OK] docker-compose.yml present"
          else
            echo "[NO] docker-compose.yml missing" && exit 1
          fi
